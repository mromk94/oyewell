version: "3.9"

name: oye-well

services:
  db:
    image: postgres:16-alpine
    container_name: oye-well-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: oyewell
      POSTGRES_PASSWORD: oyewell
      POSTGRES_DB: oyewell
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oyewell -d oyewell"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: oye-well-backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://oyewell:oyewell@db:5432/oyewell?schema=public
      JWT_SECRET: local-dev-jwt-secret-change-me
      PORT: 4000
    env_file:
      - ./backend/.env
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: sh -c "yes | npx prisma db push --skip-generate && npx prisma generate && npm run dev"

  cache:
    image: valkey/valkey:8-alpine
    container_name: oye-well-cache
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: oye-well-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:4000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev

volumes:
  postgres-data:
